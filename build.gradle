plugins { id 'fabric-loom' version '1.7.4'; id 'maven-publish' }
version = '0.3.0'
group = 'dev.doomcraft'
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.5'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.105.0+1.21.1'
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar() }
loom { runs { client {
 runDir project.hasProperty('survival') ? 'run-survival' : 'run'
 if(project.hasProperty('survival')) { vmArg '-Ddoomcraft.survival=true'; programArg '--username'; programArg 'DoomCraftPlayer' }
 else vmArg '-Ddoomcraft.autoLab=true'
 if(project.hasProperty('showcase')) vmArg '-Ddoomcraft.showcase=true'
 if(project.hasProperty('survivalDemo')) vmArg '-Ddoomcraft.survivalDemo=true'
 if(project.hasProperty('survivalResume')) vmArg '-Ddoomcraft.survivalResume=' + project.property('survivalResume')
 if(project.hasProperty('night')) vmArg '-Ddoomcraft.night=true'
 if(project.hasProperty('nightVerify')) vmArg '-Ddoomcraft.nightVerify=true'
 if(project.hasProperty('nightDemos')) vmArg '-Ddoomcraft.nightDemos=true'
 if(project.hasProperty('coverOnly')) vmArg '-Ddoomcraft.coverOnly=true'
 if(project.hasProperty('devDemos')) vmArg '-Ddoomcraft.devDemos=true'
 if(project.hasProperty('verify')) vmArg '-Ddoomcraft.verify=true'
 vmArg '-Ddoomcraft.runRoot=' + file(project.hasProperty('survival')?'run-survival':'run').absolutePath
 vmArg '-Ddoomcraft.native=' + file('build/native/libdoomcraft.dylib').absolutePath
} } }

// The distributable contains the same native engine tested by the local launcher.
tasks.register('buildNative', Exec) {
 inputs.files(fileTree('native'), fileTree('vendor/doomgeneric-master/doomgeneric'), file('tools/prepare_native.py'), file('tools/build-native.sh'))
 outputs.file('build/native/libdoomcraft.dylib')
 commandLine 'sh', './tools/build-native.sh'
}
processResources {
 dependsOn tasks.named('buildNative')
 from('build/native/libdoomcraft.dylib') { into 'natives/macos-aarch64' }
 from('LICENSE') { into 'licenses/doomcraft' }
}
